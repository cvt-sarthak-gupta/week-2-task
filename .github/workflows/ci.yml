name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend:
    name: Frontend — lint, type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check frontend
        run: npx tsc --noEmit

      - name: Lint frontend
        run: npm run lint

      - name: Run frontend unit tests (with coverage)
        run: npm run test:coverage

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: /api

  backend:
    name: Backend — type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: server

      - name: Type-check backend
        run: npx tsc --noEmit
        working-directory: server

      - name: Run backend tests
        run: npm test
        working-directory: server

  e2e:
    name: E2E — Playwright (large-scroll)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: server

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start dev servers
        run: npm run dev &
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-secret-change-in-prod-xxxxxxxxxxxxxxxx' }}
          NODE_ENV: development

      - name: Wait for servers to be ready
        run: npx wait-on http://localhost:5173 http://localhost:3001 --timeout 60000

      - name: Run E2E tests (including large-scroll)
        run: npm run test:e2e
        env:
          RUN_LARGE_SCROLL_TEST: '1'
